<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check Published Result | Laff British Montessori School</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f8ff;color:#10233f}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:24px;padding:36px;box-shadow:0 18px 55px rgba(6,59,120,.12)}.brand{text-align:center}.brand img{width:72px}.brand h1{color:#063b78;margin:10px 0 6px}.brand p{color:#66758c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.full{grid-column:1/-1}label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}input,select{width:100%;padding:14px;border:1px solid #d5e1ef;border-radius:12px;font:inherit}button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:#0755a5;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.message{margin-top:16px;padding:13px;border-radius:12px;display:none}.error{background:#fff1f0;color:#b42318}.ok{background:#ecfdf3;color:#067647}.result{display:none;margin-top:28px;border:1px solid #dce7f2;border-radius:18px;overflow:hidden}.head{padding:20px;background:#f5f9ff}.head h2{margin:0;color:#063b78}.meta{color:#66758c;line-height:1.7;font-size:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e8edf4;text-align:left;font-size:13px}.table th{background:#f8fafc}.summary{display:flex;gap:12px;padding:18px}.stat{flex:1;background:#f6f8fb;border-radius:12px;padding:14px}.stat small{display:block;color:#66758c}.stat strong{font-size:20px;color:#063b78}.home{text-align:center;margin-top:20px}.home a{color:#0755a5;font-weight:800;text-decoration:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:24px 18px}.summary{flex-direction:column}}@media print{body{background:#fff}.form,.home{display:none!important}.wrap{margin:0}.card{box-shadow:none}.result{display:block!important}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><img src="https://i.ibb.co/whtP8S5v/image.png" alt="Laff British Montessori School"><h1>Check Published Result</h1><p>Enter the result access details issued by Laff British Montessori School. Only officially published results are displayed.</p></div>
<section class="form"><form id="form"><div class="grid">
<div class="full"><label for="serial">Result Checker Serial Number</label><input id="serial" required placeholder="e.g. RC-LBS-26000001" autocomplete="off"></div>
<div><label for="pin">Result PIN</label><input id="pin" required type="password" inputmode="numeric" placeholder="Enter PIN" autocomplete="off"></div>
<div><label for="session">Academic Session</label><select id="session" required><option value="">Loading sessions...</option></select></div>
<div><label for="term">Term</label><select id="term" required><option value="">Select session first</option></select></div>
</div><button id="btn">Check Published Result</button></form><div id="msg" class="message"></div></section>
<section id="result" class="result"><div class="head"><h2 id="title">Academic Result</h2><div id="meta" class="meta"></div><button onclick="window.print()">Print Result</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Subject</th><th>Code</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th><th>Point</th><th>Remark</th></tr></thead><tbody id="rows"></tbody></table></div><div class="summary"><div class="stat"><small>Subjects</small><strong id="count">0</strong></div><div class="stat"><small>Average</small><strong id="avg">0%</strong></div><div class="stat"><small>Overall Grade</small><strong id="grade">—</strong></div></div></section>
<div class="home"><a href="index.html">← Back to School Website</a></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=window.supabase.createClient('https://moqpmrhholbbhuedvbgg.supabase.co','sb_publishable_IfSp9O5zUubH6rifFbfmZQ_DJttLC1f');
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let sessions=[],terms=[];
function message(t,ok=false){$('msg').textContent=t;$('msg').className='message '+(ok?'ok':'error');$('msg').style.display='block'}
async function init(){let a=await db.from('academic_sessions').select('id,name,is_current').order('starts_on',{ascending:false});if(a.error)throw a.error;sessions=a.data||[];let b=await db.from('terms').select('id,name,session_id');if(b.error)throw b.error;terms=b.data||[];$('session').innerHTML='<option value="">Select academic session</option>'+sessions.map(s=>`<option value="${esc(s.id)}" ${s.is_current?'selected':''}>${esc(s.name)}${s.is_current?' · Current':''}</option>`).join('');loadTerms()}
function loadTerms(){let id=$('session').value;$('term').innerHTML='<option value="">Select term</option>'+terms.filter(t=>t.session_id===id).map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('')}
function render(d){let r=d.results||[],s=d.student||{};$('title').textContent=(d.term||'')+' Result';$('meta').innerHTML='<strong>'+esc(s.name||'Student')+'</strong><br>Student ID: '+esc(s.student_id||'—')+' · Exam Number: '+esc(s.exam_number||'—')+'<br>'+esc(d.session||'')+' · '+esc(d.term||'');$('rows').innerHTML=r.length?r.map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+esc(x.code||'—')+'</td><td>'+esc(x.ca)+'</td><td>'+esc(x.exam)+'</td><td>'+esc(x.total)+'</td><td>'+esc(x.grade||'—')+'</td><td>'+esc(x.grade_point??'—')+'</td><td>'+esc(x.teacher_remark||'—')+'</td></tr>').join(''):'<tr><td colspan="8" style="text-align:center;padding:28px">No published results are available for this session and term.</td></tr>';let total=r.reduce((n,x)=>n+(Number(x.total)||0),0),av=r.length?total/r.length:0;$('count').textContent=r.length;$('avg').textContent=av.toFixed(1)+'%';$('grade').textContent=av>=70?'A':av>=60?'B':av>=50?'C':av>=45?'D':av>=40?'E':r.length?'F':'—';$('result').style.display='block'}
$('session').addEventListener('change',loadTerms);$('form').addEventListener('submit',async e=>{e.preventDefault();$('btn').disabled=true;$('btn').textContent='Checking...';$('msg').style.display='none';$('result').style.display='none';try{let s=sessions.find(x=>x.id===$('session').value);let q=await db.rpc('check_public_result',{p_serial:$('serial').value.trim(),p_pin:$('pin').value.trim(),p_session:s?.name||'',p_term:$('term').value});if(q.error)throw q.error;if(!q.data?.ok)throw new Error(q.data?.message||'Result could not be verified.');message('Published result found.',true);render(q.data)}catch(err){message(err.message||'Please check your result access details.')}finally{$('btn').disabled=false;$('btn').textContent='Check Published Result'}});init().catch(e=>message('Unable to load academic sessions.'));
</script>
</body></html>
